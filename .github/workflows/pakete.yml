# Baut die Portal-Pakete auf GitHubs Rechnern und hängt sie zum Download an.
#
# WOZU
# Die fertigen ZIPs entstehen beim Bauen und liegen deshalb absichtlich nicht
# im Repo (`pakete/` steht in .gitignore) — sonst wüchse die Versions-
# geschichte bei jedem Stand um über 180 MB. Wer sie an einem anderen Rechner
# braucht, musste sie bisher dort selbst bauen, also Node installieren und
# 247 MB klonen.
#
# Mit diesem Ablauf baut GitHub sie selbst: nach jedem Push liegen die drei
# ZIPs unter "Actions" beim jeweiligen Lauf als Download bereit. Von jedem
# Gerät, ohne Installation, immer der aktuelle Stand.
#
# SO KOMMST DU DRAN
#   1. github.com/marcovaccari20/jump-and-run-monkey  ->  Reiter "Actions"
#   2. Oben den letzten Lauf von "Pakete bauen" anklicken
#   3. Ganz unten unter "Artifacts" das gewünschte ZIP herunterladen
#
# ACHTUNG, EINE EIGENHEIT VON GITHUB: der Download ist noch einmal in ein ZIP
# verpackt. Einmal auspacken — darin liegt dann
# `jungle-climber-gamemonetize.zip`, und DAS ist die Datei fürs Portal, nicht
# die äussere.

name: Pakete bauen

on:
  push:
    branches: [main]
  # Von Hand auslösbar, ohne etwas ändern zu müssen: Actions -> Pakete bauen
  # -> "Run workflow".
  workflow_dispatch:

jobs:
  bauen:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Nutzt package-lock.json als Schlüssel — der zweite Lauf holt die
          # Abhängigkeiten aus dem Zwischenspeicher statt aus dem Netz.
          cache: npm

      # `npm ci` statt `npm install`: baut exakt das, was in package-lock.json
      # steht. Sonst könnte auf GitHub eine andere Fassung einer Abhängigkeit
      # landen als lokal, und das Paket wäre nicht mehr dasselbe.
      - name: Abhängigkeiten holen
        run: npm ci

      # Prüft die angemeldeten Bildfolgen gegen die Platte. Fehlt ein Bild,
      # soll der Lauf HIER scheitern und nicht erst im Spiel — dort liefert
      # ein fehlendes Bild still eine HTML-Seite mit Status 200.
      - name: Bilder prüfen
        run: npm run pruef:bilder

      # Die Werbeanbindung gegen ein nachgebautes SDK. Der einzige Teil des
      # Spiels, den man sonst NIE zu sehen bekommt, ohne es hochzuladen — und
      # genau dort ist zuletzt ein Fehler bis auf die Live-Seite durchgekommen.
      - name: Werbung prüfen
        run: npm run pruef:werbung

      # Baut und schnürt alle drei Ziele. Das Skript prüft dabei selbst:
      # index.html in der Wurzel, alle Pfade relativ, keine unerwarteten
      # Fremdserver, Grösse innerhalb der Portalgrenzen.
      - name: Pakete schnüren
        run: npm run paket -- --bauen

      # ENTPACKT, WEIL CRAZYGAMES KEIN ARCHIV NIMMT.
      #
      # Deren Einreichungsformular lehnt ZIPs ausdrücklich ab ("Archive files
      # are not supported, please drag and drop the files directly in the
      # upload zone") — anders als GameMonetize, das genau umgekehrt ein ZIP
      # will. Wer hier das Archiv herunterlädt, muss es also erst auspacken,
      # und wegen der GitHub-Eigenheit sogar ZWEIMAL (siehe Kopf dieser
      # Datei). Das ist die Stelle, an der es schon einmal schiefgegangen ist.
      #
      # NICHT `dist/` NEHMEN. Nach `npm run paket` steht dort die
      # PLAY-STORE-Fassung: die wird zuletzt gebaut, mit VITE_ZIEL=playstore,
      # und hat die Werbung fest abgeschaltet (CONFIG.ad.provider = 'none').
      # Ein Ordner daraus sähe richtig aus und wäre der falsche Build.
      # Entpackt wird deshalb das fertige CrazyGames-Archiv.
      - name: CrazyGames-Ordner entpacken
        run: |
          mkdir -p pakete/crazygames-dateien
          unzip -q pakete/jungle-climber-crazygames.zip -d pakete/crazygames-dateien
          test -f pakete/crazygames-dateien/index.html
          echo "Dateien: $(find pakete/crazygames-dateien -type f | wc -l)"

      # Das ist der Download für CrazyGames: einmal auspacken, fertig — darin
      # liegen index.html und die Ordner direkt, zum Hineinziehen ins Formular.
      - name: CrazyGames (Dateien zum Ziehen)
        uses: actions/upload-artifact@v4
        with:
          name: jungle-climber-crazygames-DATEIEN
          path: pakete/crazygames-dateien/
          retention-days: 30

      - name: CrazyGames (Archiv)
        uses: actions/upload-artifact@v4
        with:
          name: jungle-climber-crazygames
          path: pakete/jungle-climber-crazygames.zip
          # Die ZIPs sind schon gepackt; nochmal komprimieren kostet nur Zeit.
          compression-level: 0
          retention-days: 30

      - name: GameMonetize
        uses: actions/upload-artifact@v4
        with:
          name: jungle-climber-gamemonetize
          path: pakete/jungle-climber-gamemonetize.zip
          compression-level: 0
          retention-days: 30

      - name: Play Store
        uses: actions/upload-artifact@v4
        with:
          name: jungle-climber-playstore
          path: pakete/jungle-climber-playstore.zip
          compression-level: 0
          retention-days: 30
