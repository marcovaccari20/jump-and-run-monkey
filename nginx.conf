# ===========================================================================
#  Webserver für Jungle Climber (Coolify / beliebiger Docker-Host)
#
#  Ersetzt `vercel.json`. Die Cache-Regeln unten sind ZEILE FÜR ZEILE dieselben
#  wie dort — sie sind kein Beiwerk, sondern der Grund, warum das Spiel am
#  Handy nicht bei jedem Aufruf 37 MB neu lädt (davon 25 MB Musik).
#
#  Die Begründungen stehen ausführlich in docs/vercel.md; hier die Kurzfassung
#  an jeder Regel.
# ===========================================================================

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Kein Serverkopf mit Versionsnummer — sie sagt einem Angreifer nur,
    # welche Lücken er probieren soll.
    server_tokens off;

    # -------------------------------------------------------------- Packen
    #
    # Das JavaScript-Bündel wiegt 817 kB und schrumpft gepackt auf rund
    # 216 kB. Ohne diesen Block lädt jeder Spieler das Vierfache.
    #
    # `gzip_types` nennt NICHT mp3, webp, ogg oder glb: die sind bereits
    # komprimiert. Sie nochmals durch gzip zu schicken kostet CPU und macht
    # sie minimal GRÖSSER.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ------------------------------------------------------- Cache-Regeln

    # Ein Jahr, unveränderlich. Vite hängt einen Hash an den Dateinamen —
    # ändert sich der Inhalt, ändert sich der Name. Die Datei kann also nie
    # veralten, und der Browser muss nie nachfragen.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Ein Tag frisch, danach eine Woche im Hintergrund erneuern.
    #
    # Diese Namen sind FEST (sie kommen aus `public/`), es gibt keinen Hash.
    # Ein Jahr wäre deshalb falsch: wer die Musik neu erzeugt, bekäme
    # tagelang die alte. Ein Tag ist kurz genug, um Änderungen zu sehen, und
    # lang genug, um beim Spielen nicht dauernd 25 MB zu ziehen.
    location ~ ^/(musik|klang|textures|hazards|characters|models)/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    # GAR NICHT cachen.
    #
    # Die Einstiegsdatei verweist auf die gehashten Namen. Wird sie gecacht,
    # sieht der Spieler nach einem Update weiter die alte Fassung — der
    # klassische "warum ändert sich nichts"-Fehler.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ------------------------------------------------------------ Ausliefern
    #
    # Ein einziges HTML, keine Unterseiten — der Rückfall auf index.html ist
    # trotzdem richtig: er fängt vertippte Adressen ab, statt eine nackte
    # nginx-Fehlerseite zu zeigen.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lebenszeichen für Coolifys Zustandsprüfung. Ohne eine solche Adresse
    # startet Coolify den Container bei jedem Zweifel neu.
    location = /gesund {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
